<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.woff') format('woff');
  font-weight: 700;
}
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.woff') format('woff');
  font-weight: 900;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink:      #ff7eb3;
  --pink-dark: #e8559a;
  --pink-pale: #fff0f6;
  --pink-mid:  #ffc6e0;
  --pink-soft: #ffe4f1;
  --lilac:     #d9a8ff;
  --yellow:    #ffe066;
  --mint:      #7eecd4;
  --text:      #3a1a2e;
  --text-sub:  #c47fa0;
  --text-other:#e8c0d4;
  --cream:     #fff7fc;
}

body {
  font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif;
  background: #f9f9f9;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 28px 12px;
}

/* ── 위젯 카드 ── */
.widget {
  width: 320px;
  background: var(--cream);
  border-radius: 28px;
  overflow: hidden;
  box-shadow:
    0 4px 32px rgba(255,126,179,0.22),
    0 0 0 1.5px rgba(255,126,179,0.13);
  position: relative;
  flex-shrink: 0;
}

/* ── 헤더 ── */
.cal-header {
  background: #ff7eb3;
  padding: 16px 18px 26px;
  position: relative;
  overflow: hidden;
}
/* 물결 하단 */
.header-wave {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  line-height: 0;
}
.header-wave svg { display: block; width: 100%; }

.header-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  position: relative; z-index: 1;
}
.nav-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 1px solid rgba(255,255,255,0.5);
  color: #fff;
  font-size: 13px; font-weight: 900;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(255,255,255,0.45); }
.cal-month {
  font-size: 18px; font-weight: 900; color: #fff;
  min-width: 110px; text-align: center;
  text-shadow: 0 1px 4px rgba(180,60,130,0.2);
  letter-spacing: 0.5px;
}

/* ── 요일 ── */
.weekdays {
  display: grid; grid-template-columns: repeat(7,1fr);
  padding: 12px 12px 4px;
}
.wd {
  text-align: center; font-size: 10px; font-weight: 700;
  color: var(--text-sub); padding-bottom: 2px;
}
.wd.sun { color: #e8392a; }
.wd.sat { color: #5aabdb; }

/* ── 달력 그리드 ── */
.cal-grid {
  display: grid; grid-template-columns: repeat(7,1fr);
  padding: 0 12px 8px;
  row-gap: 2px;
}
.day-cell {
  display: flex; flex-direction: column;
  align-items: center; padding: 2px 0 3px;
  cursor: pointer; position: relative;
  border-radius: 10px;
  transition: background 0.12s;
}
.day-cell:hover { background: var(--pink-soft); }
.day-num {
  width: 30px; height: 30px;
