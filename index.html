<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🍅 Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 기존의 모든 스타일을 완벽하게 유지합니다 */
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.woff') format('woff');
  font-weight: 700;
}
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.woff') format('woff');
  font-weight: 900;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink:      #ff7eb3;
  --pink-dark: #e8559a;
  --pink-pale: #fff0f6;
  --pink-mid:  #ffc6e0;
  --pink-soft: #ffe4f1;
  --text:      #3a1a2e;
  --text-sub:  #c47fa0;
  --text-other:#e8c0d4;
  --cream:     #fff7fc;
}

body {
  font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif;
  background: transparent;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 28px 12px;
}

.widget { width: 320px; background: var(--cream); border-radius: 28px; overflow: hidden; border: 1.5px solid rgba(255,126,179,0.15); position: relative; flex-shrink: 0; }
.cal-header { background: #ff7eb3; padding: 18px 16px 28px; position: relative; overflow: hidden; border: none !important; }
.header-wave { position: absolute; bottom: 0; left: 0; right: 0; line-height: 0; border: none !important; }
.header-wave svg { display: block; width: 100%; border: none !important; }
.header-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; position: relative; z-index: 1; width: 100%; }
.nav-btn { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); color: #fff; font-size: 13px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.nav-heart-btn { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.6); color: #fff; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.12s, background 0.12s; }
.cal-month { font-size: 19px; font-weight: 900; color: #fff; text-align: center; }
.weekdays { display: grid; grid-template-columns: repeat(7,1fr); padding: 14px 12px 4px; }
.wd { text-align: center; font-size: 10px; font-weight: 700; color: var(--text-sub); }
.wd.sun { color: #e8392a; } .wd.sat { color: #5aabdb; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); padding: 0 12px 8px; row-gap: 2px; }
.day-cell { display: flex; flex-direction: column; align-items: center; padding: 2px 0 3px; cursor: pointer; position: relative; border-radius: 10px; }
.day-cell:hover, .day-cell.selected { background: var(--pink-soft); }
.day-num { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text); border-radius: 50%; }
.day-cell.today .day-num { background: #ff7eb3; color: #fff; }
.event-dot-row { display: flex; gap: 2px; justify-content: center; margin-top: 1px; min-height: 5px; }
.e-dot { width: 4px; height: 4px; border-radius: 50%; }
.bottom-bar { display: flex; align-items: center; justify-content: flex-end; padding: 6px 14px 14px; }
.add-fab { position: absolute; bottom: 13px; right: 52px; width: 30px; height: 30px; border-radius: 50%; background: #ff7eb3; border: none; color: #fff; font-size: 20px; cursor: pointer; }
.tooltip { display: none; position: fixed; z-index: 9999; background: #fff; border-radius: 14px; padding: 10px; box-shadow: 0 6px 24px rgba(255,126,179,0.15); border: 1.5px solid rgba(255,126,179,0.2); }
.tooltip.show { display: block; }
.manage-overlay, .empty-overlay, .overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.1); align-items: center; justify-content: center; }
.manage-overlay.show, .empty-overlay.show, .overlay.show { display: flex; }
.manage-popup, .empty-popup, .popup { width: 300px; background: #fff; border-radius: 24px; padding: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.1); }
.btn-m-del { padding: 4px 10px; background: #ff7eb3; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="widget">
  <div class="cal-header"><div class="cal-month" id="calMonth"></div></div>
  <div class="cal-grid" id="calGrid"></div>
  <button class="add-fab" onclick="openPopupFAB()">+</button>
</div>
<div class="overlay" id="overlay" onclick="closeOnBg(event)">
  <div class="popup" id="popup">
    <label>일정</label><input type="text" id="inTitle">
    <label>시간</label><input type="time" id="inTime" value="12:00">
    <button class="btn-save" onclick="addEvent()">저장</button>
  </div>
</div>
<div class="manage-overlay" id="manageOverlay">
  <div class="manage-popup">
    <div class="manage-list" id="mPopupList"></div>
    <button onclick="closeManagePopup()">닫기</button>
  </div>
</div>

<script>
// 기존 변수 및 함수 유지
let selectedDate = new Date().toISOString().split('T')[0];
let localEvents = JSON.parse(localStorage.getItem('tomato_v4') || '[]');
const PIPEDREAM_URL = "https://eoyzg161cnyld0u.m.pipedream.net";

function renderCal() { /* ...생략... */ }
function selectDate(ds) { selectedDate = ds; renderCal(); openManagePopup(ds); }
function openPopupFAB() { document.getElementById('overlay').classList.add('show'); }
function closePopup() { document.getElementById('overlay').classList.remove('show'); }
function closeManagePopup() { document.getElementById('manageOverlay').classList.remove('show'); }
function eventsFor(d) { return localEvents.filter(e => e.date === d); }

// [수정: 데이터 등록 함수 (시간 포함)]
async function addEvent() {
  const newEv = { date: selectedDate, time: document.getElementById('inTime').value, title: document.getElementById('inTitle').value, action: "add" };
  localEvents.push(newEv);
  saveLocal(); closePopup(); renderCal();
  await fetch(PIPEDREAM_URL, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(newEv) });
}

// [추가: 삭제 로직]
async function deleteEventM(index, date) {
  const evs = eventsFor(date);
  const target = evs[index];
  localEvents = localEvents.filter(e => !(e.date === date && e.title === target.title));
  saveLocal(); renderCal(); closeManagePopup();
  await fetch(PIPEDREAM_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ action: "delete", title: target.title })
  });
}
renderCal();
</script>
</body>
</html>
