<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍅 Calendar</title>
<style>

/* ... (생략) ... */
</style>
</head>
<body>
<script>
// 기존 기능 유지
async function addEvent() {
  const time = `${selHour}:${selMin}`;
  const title = document.getElementById('inTitle').value.trim();
  let cat = pickedCat === '__custom__' ? document.getElementById('catCustom').value.trim() : pickedCat;
  
  const newEv = { date: selectedDate, time, title, cat, color: pickedColor, action: "add" };
  localEvents.push(newEv);
  saveLocal(); 
  closePopup(); 
  renderCal();

  if (PIPEDREAM_URL) {
    try {
      const notionDate = `${selectedDate}T${time}:00+09:00`;
      await fetch(PIPEDREAM_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...newEv, date: notionDate })
      });
    } catch (err) { console.error("전송 에러:", err); }
  }
}

// 삭제 기능 추가
async function deleteEventM(index, date) {
  const evs = eventsFor(date);
  const target = evs[index];
  
  localEvents = localEvents.filter(e => !(e.date === date && e.title === target.title && e.time === target.time));
  saveLocal();
  renderCal();
  
  try {
    await fetch(PIPEDREAM_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "delete", title: target.title })
    });
  } catch (err) { console.error("삭제 연동 에러:", err); }
  
  closeManagePopup();
}
</script>
</body>
</html>
