// [추가된 핵심 로직: 삭제 처리]
async function deleteEventM(index, date) {
  const evs = eventsFor(date);
  const target = evs[index];
  
  // 1. 화면에서 즉시 삭제
  localEvents = localEvents.filter(e => !(e.date === date && e.title === target.title && e.time === target.time));
  saveLocal();
  renderCal();
  
  // 2. 노션에도 삭제 신호 보내기 (파이프드림 워크플로우에 'delete' 액션 전달)
  try {
    await fetch(PIPEDREAM_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "delete", title: target.title })
    });
  } catch (err) {
    console.error("노션 삭제 연동 에러:", err);
  }
  
  // 3. 팝업 닫기 및 새로고침
  if (eventsFor(date).length > 0 || HOLIDAYS[date]) {
    openManagePopup(date);
  } else {
    closeManagePopup();
  }
}
