<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🍅 Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 기존의 모든 스타일을 그대로 포함했습니다 */
@font-face { font-family: 'NanumSquareRound'; src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.woff') format('woff'); font-weight: 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --pink: #ff7eb3; --pink-soft: #ffe4f1; --cream: #fff7fc; --text: #3a1a2e; --text-sub: #c47fa0; }
body { font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif; background: transparent; padding: 28px; display: flex; justify-content: center; }
.widget { width: 320px; background: var(--cream); border-radius: 28px; border: 1.5px solid rgba(255,126,179,0.15); }
.cal-header { background: #ff7eb3; padding: 20px; color: #fff; text-align: center; font-weight: 900; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); padding: 10px; }
.day-cell { padding: 10px; text-align: center; cursor: pointer; border-radius: 10px; }
.day-cell:hover { background: var(--pink-soft); }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); align-items: center; justify-content: center; z-index: 100; }
.overlay.show { display: flex; }
.popup { width: 300px; background: #fff; padding: 20px; border-radius: 20px; }
input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; }
.btn-save { width: 100%; padding: 10px; background: #ff7eb3; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
.btn-del { width: 100%; padding: 10px; background: #ff4d4d; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px; }
</style>
</head>
<body>
<div class="widget">
  <div class="cal-header" id="calMonth">May 2026</div>
  <div class="cal-grid" id="calGrid"></div>
  <button class="add-fab" onclick="openPopupFAB()">+</button>
</div>

<div class="overlay" id="overlay" onclick="closePopup()">
  <div class="popup" onclick="event.stopPropagation()">
    <label>일정 내용</label><input type="text" id="inTitle">
    <label>시간</label><input type="time" id="inTime" value="12:00">
    <button class="btn-save" onclick="addEvent()">저장</button>
    <button class="btn-del" onclick="deleteEvent()">삭제</button>
  </div>
</div>

<script>
let selectedDate = new Date().toISOString().split('T')[0];
let localEvents = JSON.parse(localStorage.getItem('tomato_v4') || '[]');
const PIPEDREAM_URL = "https://eoyzg161cnyld0u.m.pipedream.net";

function renderCal() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  for(let i=1; i<=31; i++) {
    const d = `2026-05-${String(i).padStart(2,'0')}`;
    grid.innerHTML += `<div class="day-cell" onclick="selectDate('${d}')">${i}</div>`;
  }
}
function selectDate(ds) { selectedDate = ds; openPopupFAB(); }
function openPopupFAB() { document.getElementById('overlay').classList.add('show'); }
function closePopup() { document.getElementById('overlay').classList.remove('show'); }

// 수정된 저장/전송 함수 (시간 포함)
async function addEvent() {
  const newEv = { 
    date: selectedDate, 
    time: document.getElementById('inTime').value, 
    title: document.getElementById('inTitle').value, 
    action: "add" 
  };
  localEvents.push(newEv);
  localStorage.setItem('tomato_v4', JSON.stringify(localEvents));
  closePopup();
  await fetch(PIPEDREAM_URL, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(newEv) });
  alert("등록 완료!");
  renderCal();
}

// 수정된 삭제 함수
async function deleteEvent() {
  const title = document.getElementById('inTitle').value;
  localEvents = localEvents.filter(e => e.title !== title);
  localStorage.setItem('tomato_v4', JSON.stringify(localEvents));
  closePopup();
  await fetch(PIPEDREAM_URL, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ action: "delete", title: title }) });
  alert("삭제 완료!");
  renderCal();
}
renderCal();
</script>
</body>
</html>
