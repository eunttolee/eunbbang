<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🍅 Calendar</title>
<style>
/* CSS는 이전과 동일하게 유지 */
@font-face { font-family: 'NanumSquareRound'; src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.woff') format('woff'); font-weight: 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --pink: #ff7eb3; --pink-soft: #ffe4f1; --cream: #fff7fc; --text: #3a1a2e; }
body { font-family: 'NanumSquareRound', sans-serif; background: transparent; padding: 20px; display: flex; justify-content: center; }
.widget { width: 320px; background: var(--cream); border-radius: 28px; padding-bottom: 20px; border: 1.5px solid rgba(255,126,179,0.15); }
.cal-header { background: #ff7eb3; padding: 20px; color: #fff; text-align: center; font-weight: 900; border-radius: 28px 28px 0 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); padding: 10px; }
.day-cell { padding: 10px; text-align: center; cursor: pointer; border-radius: 10px; }
.day-cell:hover { background: var(--pink-soft); }
.add-fab { width: 50px; height: 50px; border-radius: 50%; background: #ff7eb3; color: #fff; border: none; font-size: 24px; cursor: pointer; margin: 10px auto; display: block; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); align-items: center; justify-content: center; }
.overlay.show { display: flex; }
.popup { width: 280px; background: #fff; padding: 20px; border-radius: 20px; }
input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; }
.btn-save { width: 100%; padding: 10px; background: #ff7eb3; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="widget">
  <div class="cal-header" id="calMonth">May</div>
  <div class="cal-grid" id="calGrid"></div>
  <button class="add-fab" onclick="openPopupFAB()">+</button>
</div>

<div class="overlay" id="overlay" onclick="closePopup()">
  <div class="popup" onclick="event.stopPropagation()">
    <label>일정</label><input type="text" id="inTitle">
    <label>시간</label><input type="time" id="inTime" value="12:00">
    <button class="btn-save" onclick="addEvent()">저장</button>
  </div>
</div>

<script>
let selectedDate = new Date().toISOString().split('T')[0];
let localEvents = JSON.parse(localStorage.getItem('tomato_v4') || '[]');
const PIPEDREAM_URL = "https://eoyzg161cnyld0u.m.pipedream.net";

function renderCal() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  for(let i=1; i<=30; i++) {
    const d = `2026-05-${String(i).padStart(2,'0')}`;
    grid.innerHTML += `<div class="day-cell" onclick="selectDate('${d}')">${i}</div>`;
  }
}
function selectDate(ds) { selectedDate = ds; openPopupFAB(); }
function openPopupFAB() { document.getElementById('overlay').classList.add('show'); }
function closePopup() { document.getElementById('overlay').classList.remove('show'); }

async function addEvent() {
  const newEv = { date: selectedDate, time: document.getElementById('inTime').value, title: document.getElementById('inTitle').value };
  localEvents.push(newEv);
  localStorage.setItem('tomato_v4', JSON.stringify(localEvents));
  closePopup();
  
  await fetch(PIPEDREAM_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(newEv)
  });
  alert("등록 완료!");
}
renderCal();
</script>
</body>
</html>
