<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🍅 Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.woff') format('woff');
  font-weight: 700;
}
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.woff') format('woff');
  font-weight: 900;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink:      #ff7eb3;
  --pink-dark: #e8559a;
  --pink-pale: #fff0f6;
  --pink-mid:  #ffc6e0;
  --pink-soft: #ffe4f1;
  --text:      #3a1a2e;
  --text-sub:  #c47fa0;
  --text-other:#e8c0d4;
  --cream:     #fff7fc;
}

body {
  font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif;
  background: transparent;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 28px 12px;
}

/* ── 위젯 카드 ── */
.widget {
  width: 320px;
  background: var(--cream);
  border-radius: 28px;
  overflow: hidden;
  border: 1.5px solid rgba(255,126,179,0.15);
  position: relative;
  flex-shrink: 0;
  box-shadow: 0 4px 15px rgba(255,126,179,0.08);
}

/* ── 헤더 ── */
.cal-header {
  background: #ff7eb3;
  padding: 18px 16px 28px;
  position: relative;
  overflow: hidden;
}
.header-wave {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  line-height: 0;
}
.header-wave svg { display: block; width: 100%; }
.header-nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  position: relative;
  z-index: 1;
}
.nav-left-zone { display: flex; justify-content: flex-end; padding-right: 18px; }
.nav-center-zone { display: flex; justify-content: center; align-items: center; }
.nav-right-zone { display: flex; justify-content: flex-start; align-items: center; padding-left: 18px; gap: 8px; }

.nav-btn {
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5);
  color: #fff; font-size: 13px; font-weight: 900; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(255,255,255,0.45); }
.nav-heart-btn {
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.6);
  color: #fff; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s;
}
.nav-heart-btn:hover { transform: scale(1.1); }
.cal-month { font-size: 19px; font-weight: 900; color: #fff; text-align: center; }

/* ── 요일 및 달력 ── */
.weekdays { display: grid; grid-template-columns: repeat(7,1fr); padding: 14px 12px 4px; }
.wd { text-align: center; font-size: 10px; font-weight: 700; color: var(--text-sub); }
.wd.sun { color: #e8392a; }
.wd.sat { color: #5aabdb; }

.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); padding: 0 12px 8px; row-gap: 2px; }
.day-cell { display: flex; flex-direction: column; align-items: center; padding: 2px 0 3px; cursor: pointer; border-radius: 10px; transition: background 0.12s; }
.day-cell:hover, .day-cell.selected { background: var(--pink-soft); }

.day-num { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text); border-radius: 50%; position: relative; z-index: 2; }
.day-cell.other-month .day-num { color: var(--text-other); }
.day-cell.sun .day-num  { color: #e8392a; }
.day-cell.sat .day-num  { color: #5aabdb; }
.day-cell.today:not(.has-event) .day-num { background: #ff7eb3; color: #fff !important; font-weight: 900; }
.day-cell.has-event .day-num { color: #ff7eb3 !important; font-weight: 900; }
.day-cell.has-event .day-num::before { content: '❤'; position: absolute; font-size: 32px; color: var(--heart, #ffe4f1); opacity: 0.55; z-index: -1; pointer-events: none; }
.event-dot-row { display: flex; gap: 2px; justify-content: center; margin-top: 1px; min-height: 5px; }
.e-dot { width: 4px; height: 4px; border-radius: 50%; }

/* ── 하단 바 ── */
.bottom-bar { display: flex; align-items: center; justify-content: flex-end; padding: 6px 14px 14px; gap: 8px; }
.refresh-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,126,179,0.35); background: none; color: var(--pink); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.12s; }
.add-fab { position: absolute; bottom: 13px; right: 52px; width: 30px; height: 30px; border-radius: 50%; background: #ff7eb3; color: #fff; font-size: 20px; font-weight: 300; cursor: pointer; border: none; box-shadow: 0 2px 8px rgba(255,126,179,0.25); }

/* ── 일정 추가 오버레이 ── */
.overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(180,60,130,0.03); backdrop-filter: blur(1px); align-items: center; justify-content: center; }
.overlay.show { display: flex; }
.popup { width: 300px; background: var(--cream); border-radius: 24px; box-shadow: 0 8px 40px rgba(255,126,179,0.2); overflow: hidden; }
.popup-header { background: #ff7eb3; padding: 16px 18px; text-align: center; color: #fff; }
.popup-title { font-size: 15px; font-weight: 900; }
.popup-date-label { font-size: 13px; margin-top: 4px; }
.popup-body { padding: 16px 18px; }
.popup-body label { font-size: 11px; font-weight: 700; color: var(--text-sub); display: block; margin: 10px 0 4px; }
.popup-body input[type="text"] { width: 100%; border: 1.5px solid rgba(255,126,179,0.25); border-radius: 10px; padding: 8px; font-size: 12px; outline: none; }
.time-picker-box { width: 100%; border: 1.5px solid rgba(255,126,179,0.25); border-radius: 10px; padding: 8px; font-size: 12px; background: #fff; cursor: pointer; text-align: center; }
.popup-btns { display: flex; gap: 8px; margin-top: 20px; }
.popup-btns button { flex: 1; padding: 10px; border-radius: 10px; font-weight: 900; font-size: 12px; cursor: pointer; border: none; }
.btn-cancel { background: #ffe4f1; color: #e8559a; }
.btn-save { background: #ff7eb3; color: #fff; }

/* 카테고리 & 컬러 */
.cat-row { display: flex; gap: 5px; flex-wrap: wrap; }
.cat-chip { padding: 4px 11px; border-radius: 99px; font-size: 11px; font-weight: 700; border: 1.5px solid rgba(255,126,179,0.25); background: #fff; color: var(--text-sub); cursor: pointer; }
.cat-chip.on { background: #ff7eb3; color: #fff; border-color: #ff7eb3; }
.color-row { display: flex; gap: 7px; flex-wrap: wrap; }
.swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; }
.swatch.on { border-color: var(--text); }
</style>
</head>
<body>

<div class="widget">
  <div class="cal-header">
    <div class="header-nav">
      <div class="nav-left-zone"><button class="nav-btn" onclick="changeMonth(-1)">←</button></div>
      <div class="nav-center-zone"><div class="cal-month" id="calMonth"></div></div>
      <div class="nav-right-zone">
        <button class="nav-btn" onclick="changeMonth(1)">→</button>
        <button class="nav-heart-btn" onclick="goToday()">❤</button>
      </div>
    </div>
  </div>
  <div class="weekdays">
    <div class="wd sun">일</div><div class="wd">월</div><div class="wd">화</div>
    <div class="wd">수</div><div class="wd">목</div><div class="wd">금</div><div class="wd sat">토</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="bottom-bar">
    <button class="refresh-btn" onclick="location.reload()">↻</button>
  </div>
  <button class="add-fab" onclick="openPopupFAB()">+</button>
</div>

<div class="overlay" id="overlay" onclick="closeOnBg(event)">
  <div class="popup" id="popup" onclick="event.stopPropagation()">
    <div class="popup-header">
      <div class="popup-title">일정 추가 🍅</div>
      <div class="popup-date-label" id="popupDateLabel">날짜 선택됨</div>
    </div>
    <div class="popup-body">
      <label>시간</label>
      <div class="time-picker-box">12:00 (기본값)</div>
      
      <label>일정 내용</label>
      <input type="text" id="inTitle" placeholder="무슨 일정인가요?">
      
      <label>카테고리</label>
      <div class="cat-row">
        <button class="cat-chip on" data-cat="약속" onclick="pickCat(this)">약속</button>
        <button class="cat-chip" data-cat="업무" onclick="pickCat(this)">업무</button>
      </div>

      <label>색상</label>
      <div class="color-row">
        <div class="swatch on" style="background:#ff7eb3" data-color="#ff7eb3" onclick="pickColor(this)"></div>
        <div class="swatch" style="background:#7eecd4" data-color="#7eecd4" onclick="pickColor(this)"></div>
      </div>

      <div class="popup-btns">
        <button class="btn-cancel" onclick="closePopup()">취소</button>
        <button class="btn-save" onclick="addEvent()">노션으로 전송 🩷</button>
      </div>
    </div>
  </div>
</div>

<script>
let pickedColor = '#ff7eb3';
let pickedCat   = '약속';
let selectedDate = '';
let localEvents = [];
const today = new Date();
const PIPEDREAM_URL = "https://eoyzg161cnyld0u.m.pipedream.net";

function pickColor(el) { document.querySelectorAll('.swatch').forEach(s => s.classList.remove('on')); el.classList.add('on'); pickedColor = el.dataset.color; }
function pickCat(el) { document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('on')); el.classList.add('on'); pickedCat = el.dataset.cat; }

function openPopupFAB() {
  if (!selectedDate) { alert('날짜를 먼저 클릭해주세요! 🍅'); return; }
  document.getElementById('popupDateLabel').textContent = selectedDate;
  document.getElementById('inTitle').value = '';
  document.getElementById('overlay').classList.add('show');
}
function closePopup() { document.getElementById('overlay').classList.remove('show'); }
function closeOnBg(e) { if (e.target === document.getElementById('overlay')) closePopup(); }

function selectDate(ds) { selectedDate = ds; renderCal(); openPopupFAB(); }
function goToday() { CY = today.getFullYear(); CM = today.getMonth(); selectedDate = fmtDate(today); renderCal(); }

let CY = today.getFullYear(), CM = today.getMonth();
function changeMonth(d) { CM += d; if (CM > 11) { CM = 0; CY++; } if (CM < 0) { CM = 11; CY--; } renderCal(); }
function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function renderCal() {
  document.getElementById('calMonth').textContent = `${CY}년 ${CM+1}월`;
  const firstDay = new Date(CY, CM, 1).getDay();
  const daysInMonth = new Date(CY, CM+1, 0).getDate();
  let html = '';
  
  for(let i=0; i<firstDay; i++) { html += `<div class="day-cell other-month"><div class="day-num">-</div></div>`; }
  
  for(let day=1; day<=daysInMonth; day++) {
    const ds = fmtDate(new Date(CY, CM, day));
    const isT = ds === fmtDate(today);
    let cls = 'day-cell';
    if(isT) cls += ' today';
    if(ds === selectedDate) cls += ' selected';
    
    html += `<div class="${cls}" onclick="selectDate('${ds}')"><div class="day-num">${day}</div><div class="event-dot-row"></div></div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

async function addEvent() {
  const title = document.getElementById('inTitle').value.trim();
  if (!title) { alert('일정 내용을 입력해주세요!'); return; }
  
  const newEv = { date: selectedDate, time: "12:00", title, cat: pickedCat, color: pickedColor };
  closePopup(); 
  alert("서버로 전송을 시작합니다! 🚀");

  try {
    await fetch(PIPEDREAM_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(newEv)
    });
    alert("✨ 노션에 일정이 등록되었습니다!");
  } catch (err) {
    alert("전송 에러가 발생했습니다.");
  }
}

renderCal();
</script>
</body>
</html>
