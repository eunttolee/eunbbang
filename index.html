<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.woff') format('woff');
  font-weight: 700;
}
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.woff') format('woff');
  font-weight: 900;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink:      #ff7eb3;
  --pink-dark: #e8559a;
  --pink-pale: #fff0f6;
  --pink-mid:  #ffc6e0;
  --pink-soft: #ffe4f1;
  --lilac:     #d9a8ff;
  --yellow:    #ffe066;
  --mint:      #7eecd4;
  --text:      #3a1a2e;
  --text-sub:  #c47fa0;
  --text-other:#e8c0d4;
  --cream:     #fff7fc;
}

body {
  font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif;
  background: #f9f9f9;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 28px 12px;
}

/* ── 위젯 카드 ── */
.widget {
  width: 320px;
  background: var(--cream);
  border-radius: 28px;
  overflow: hidden;
  box-shadow:
    0 4px 32px rgba(255,126,179,0.22),
    0 0 0 1.5px rgba(255,126,179,0.13);
  position: relative;
  flex-shrink: 0;
}

/* ── 헤더 ── */
.cal-header {
  background: #ff7eb3;
  padding: 16px 18px 26px;
  position: relative;
  overflow: hidden;
}
.header-wave {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  line-height: 0;
}
.header-wave svg { display: block; width: 100%; }

.header-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  position: relative; z-index: 1;
}
.nav-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 1px solid rgba(255,255,255,0.5);
  color: #fff;
  font-size: 13px; font-weight: 900;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(255,255,255,0.45); }
.cal-month {
  font-size: 18px; font-weight: 900; color: #fff;
  min-width: 110px; text-align: center;
  text-shadow: 0 1px 4px rgba(180,60,130,0.2);
  letter-spacing: 0.5px;
}

/* ── 요일 ── */
.weekdays {
  display: grid; grid-template-columns: repeat(7,1fr);
  padding: 12px 12px 4px;
}
.wd {
  text-align: center; font-size: 10px; font-weight: 700;
  color: var(--text-sub); padding-bottom: 2px;
}
.wd.sun { color: #e8392a; }
.wd.sat { color: #5aabdb; }

/* ── 달력 그리드 ── */
.cal-grid {
  display: grid; grid-template-columns: repeat(7,1fr);
  padding: 0 12px 8px;
  row-gap: 2px;
}
.day-cell {
  display: flex; flex-direction: column;
  align-items: center; padding: 2px 0 3px;
  cursor: pointer; position: relative;
  border-radius: 10px;
  transition: background 0.12s;
}
.day-cell:hover { background: var(--pink-soft); }
.day-num {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--text);
  border-radius: 50%;
  transition: all 0.12s;
  position: relative;
}
.day-cell.other-month .day-num { color: var(--text-other); }
.day-cell.sun .day-num  { color: #e8392a; }
.day-cell.sat .day-num  { color: #5aabdb; }

/* 오늘 */
.day-cell.today:not(.has-event) .day-num {
  background: #ff7eb3;
  color: #fff;
  font-weight: 900;
  border-radius: 50%;
}

/* 선택 상태 */
.day-cell.selected:not(.has-event):not(.today) .day-num {
  color: #ff7eb3 !important;
  font-weight: 900;
}
.day-cell.selected:not(.has-event):not(.today) .day-num::before {
  content: '❤';
  position: absolute;
  font-size: 32px;
  line-height: 1;
  top: 50%; left: 50%;
  transform: translate(-50%, -48%);
  color: var(--pink-soft);
  z-index: -1;
  pointer-events: none;
}
.day-cell.selected.today .day-num {
  background: #ff7eb3;
  color: #fff !important;
  border-radius: 50%;
  outline: 2.5px solid #ff7eb3;
  outline-offset: 2px;
}

/* 이벤트 날짜 */
.day-cell.has-event .day-num {
  color: #fff !important;
  font-weight: 900;
}
.day-cell.has-event .day-num::before {
  content: '❤';
  position: absolute;
  font-size: 32px;
  line-height: 1;
  top: 50%; left: 50%;
  transform: translate(-50%, -48%);
  color: var(--heart, #ff7eb3);
  z-index: -1;
  pointer-events: none;
}

.event-dot-row {
  display: flex; gap: 2px;
  justify-content: center;
  margin-top: 1px;
  min-height: 5px;
}
.e-dot { width: 4px; height: 4px; border-radius: 50%; }

/* 공휴일 빨강 */
.day-cell.holiday .day-num { color: #e8392a; font-weight: 900; }
.day-cell.holiday.other-month .day-num { color: var(--text-other); }
.holiday-dot { width: 4px; height: 4px; border-radius: 50%; background: #e8392a; }

/* 하단 바 */
.bottom-bar {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 6px 14px 14px; gap: 8px;
}
.refresh-btn {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1.5px solid rgba(255,126,179,0.35);
  background: none; color: var(--pink); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s;
}
.refresh-btn.spinning { animation: spin 0.6s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

.add-fab {
  position: absolute;
  bottom: 13px; right: 52px;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #ff7eb3;
  border: none; color: #fff;
  font-size: 20px; font-weight: 300; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(255,126,179,0.35);
  transition: transform 0.15s;
}
.add-fab:hover { transform: scale(1.1); }

/* 툴팁 */
.tooltip {
  display: none; position: fixed; z-index: 9999;
  background: #fff; border-radius: 14px; padding: 10px 14px;
  box-shadow: 0 6px 24px rgba(255,126,179,0.2);
  min-width: 130px; max-width: 210px; pointer-events: none;
  border: 1.5px solid rgba(255,126,179,0.2);
}
.tooltip.show { display: block; }
.tooltip-date { font-size: 10px; font-weight: 900; color: var(--pink-dark); margin-bottom: 6px; }
.tooltip-item { display: flex; align-items: flex-start; gap: 6px; font-size: 11px; color: var(--text); padding: 2px 0; }
