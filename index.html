<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🍅 Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'NanumSquareRound'; src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.woff') format('woff'); font-weight: 700; }
@font-face { font-family: 'NanumSquareRound'; src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.woff') format('woff'); font-weight: 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --pink: #ff7eb3; --pink-dark: #e8559a; --pink-pale: #fff0f6; --pink-mid: #ffc6e0; --pink-soft: #ffe4f1; --lilac: #d9a8ff; --yellow: #ffe066; --mint: #7eecd4; --text: #3a1a2e; --text-sub: #c47fa0; --text-other:#e8c0d4; --cream: #fff7fc; }
body { font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif; background: transparent; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 28px 12px; }
.widget { width: 320px; background: var(--cream); border-radius: 28px; overflow: hidden; border: 1.5px solid rgba(255,126,179,0.15); position: relative; flex-shrink: 0; }
.cal-header { background: #ff7eb3; padding: 18px 16px 28px; position: relative; overflow: hidden; border: none !important; }
.header-wave { position: absolute; bottom: 0; left: 0; right: 0; line-height: 0; border: none !important; }
.header-wave svg { display: block; width: 100%; border: none !important; }
.header-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; position: relative; z-index: 1; width: 100%; }
.nav-left-zone { display: flex; justify-content: flex-end; padding-right: 18px; }
.nav-center-zone { display: flex; justify-content: center; align-items: center; }
.nav-right-zone { display: flex; justify-content: flex-start; align-items: center; padding-left: 18px; gap: 8px; }
.nav-btn { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); color: #fff; font-size: 13px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; transition: background 0.15s; }
.nav-btn:hover { background: rgba(255,255,255,0.45); }
.nav-heart-btn { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.6); color: #fff; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.12s, background 0.12s; }
.nav-heart-btn:hover { background: rgba(255,255,255,0.5); transform: scale(1.1); }
.cal-month { font-size: 19px; font-weight: 900; color: #fff; text-align: center; }
.weekdays { display: grid; grid-template-columns: repeat(7,1fr); padding: 14px 12px 4px; }
.wd { text-align: center; font-size: 10px; font-weight: 700; color: var(--text-sub); }
.wd.sun { color: #e8392a; } .wd.sat { color: #5aabdb; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); padding: 0 12px 8px; row-gap: 2px; }
.day-cell { display: flex; flex-direction: column; align-items: center; padding: 2px 0 3px; cursor: pointer; position: relative; border-radius: 10px; transition: background 0.12s; }
.day-cell:hover, .day-cell.selected { background: var(--pink-soft); }
.day-num { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text); border-radius: 50%; transition: all 0.12s; position: relative; z-index: 2; }
.day-cell.today .day-num { background: #ff7eb3; color: #fff; font-weight: 900; }
.day-cell.has-event .day-num { color: #ff7eb3 !important; font-weight: 900; }
.event-dot-row { display: flex; gap: 2px; justify-content: center; margin-top: 1px; min-height: 5px; }
.e-dot { width: 4px; height: 4px; border-radius: 50%; }
.bottom-bar { display: flex; align-items: center; justify-content: flex-end; padding: 6px 14px 14px; gap: 8px; }
.refresh-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(255,126,179,0.35); background: none; color: var(--pink); font-size: 15px; cursor: pointer; }
.add-fab { position: absolute; bottom: 13px; right: 52px; width: 30px; height: 30px; border-radius: 50%; background: #ff7eb3; border: none; color: #fff; font-size: 20px; font-weight: 300; cursor: pointer; }
.manage-overlay { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.15); align-items: center; justify-content: center; }
.manage-overlay.show { display: flex; }
.manage-popup { width: 280px; background: #fff; border-radius: 24px; padding: 22px 18px; }
.manage-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--cream); border-radius: 12px; gap: 6px; }
.btn-m-del { padding: 4px 10px; background: var(--pink-soft); color: var(--pink-dark); border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="widget">
  <div class="cal-header"><div class="header-nav"><div class="nav-center-zone"><div class="cal-month" id="calMonth"></div></div></div></div>
  <div class="cal-grid" id="calGrid"></div>
  <button class="add-fab" onclick="openPopup()">+</button>
</div>
<div class="manage-overlay" id="manageOverlay">
  <div class="manage-popup">
    <div class="manage-list" id="mPopupList"></div>
    <button onclick="closeManagePopup()">닫기</button>
  </div>
</div>
<script>
let localEvents = JSON.parse(localStorage.getItem('tomato_v4') || '[]');
const PIPEDREAM_URL = "https://eoyzg161cnyld0u.m.pipedream.net";

function renderCal() { /* 기존 렌더링 로직 */ }
function openPopup() { document.getElementById('manageOverlay').classList.add('show'); }
function closeManagePopup() { document.getElementById('manageOverlay').classList.remove('show'); }
function saveLocal() { localStorage.setItem('tomato_v4', JSON.stringify(localEvents)); }

// [수정: 데이터 등록 시 파이프드림으로 전송]
async function addEvent() {
  const newEv = { date: selectedDate, title: "할일", action: "add" };
  localEvents.push(newEv); saveLocal(); renderCal();
  await fetch(PIPEDREAM_URL, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(newEv) });
}

// [추가: 삭제 로직 - 기존 코드 유지하면서 이 함수만 덧붙임]
async function deleteEventM(index, date) {
  const evs = localEvents.filter(e => e.date === date);
  const target = evs[index];
  localEvents = localEvents.filter(e => !(e.date === date && e.title === target.title));
  saveLocal(); renderCal();
  
  await fetch(PIPEDREAM_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ action: "delete", title: target.title })
  });
  closeManagePopup();
}
renderCal();
</script>
</body>
</html>
