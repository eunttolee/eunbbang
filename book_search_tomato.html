<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 책 검색</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet">
<style>@import url("https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css");</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red: #e8392a;
  --red-light: #ff6b5b;
  --red-pale: #fff0ee;
  --red-mid: #ffd5d0;
  --green: #4a7c3f;
  --green-light: #7ab870;
  --cream: #fffaf9;
  --text: #3a1a16;
  --text-sub: #9b6b65;
  --border: rgba(232,57,42,0.15);
  --check-size: 18px;
}

body {
  font-family: 'NanumSquareRound', 'Nanum Gothic', -apple-system, sans-serif;
  background: transparent;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 16px 12px;
}

.widget {
  width: 100%;
  max-width: 300px;
  background: var(--cream);
  border-radius: 20px;
  border: none;
  overflow: hidden;
  box-shadow: none;
  outline: 2px solid rgba(232,57,42,0.2);
  position: relative;
}

/* 헤더 */
.widget-header {
  background: transparent;
  padding: 10px 16px 0px;
  position: relative;
  z-index: 1;
  text-align: center;
}

.header-inner {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.header-emoji-row { display: none; }
.header-title {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.5px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.header-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.85);
  margin-top: 3px;
  letter-spacing: 0.3px;
}

/* 물결 구분선 */
.check-divider {
  height: 20px;
  display: block;
  line-height: 0;
  overflow: hidden;
  position: relative;
}

/* 검색창 */
.search-wrap {
  padding: 1px 16px 10px;
  background: var(--cream);
  border-bottom: 1.5px solid rgba(232,57,42,0.15);
}

.search-box {
  display: flex;
  align-items: center;
  background: #fff;
  border: 2px solid var(--red-mid);
  border-radius: 14px;
  padding: 0 8px 0 14px;
  gap: 8px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.search-box:focus-within {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(232,57,42,0.1);
}
.search-input {
  flex: 1;
  padding: 11px 0;
  border: none;
  background: none;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  outline: none;
}
.search-input::placeholder { color: #d4a09a; }
.search-btn {
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 7px 14px;
  font-size: 12px;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 4px;
  letter-spacing: 0.3px;
}
.search-btn:hover { background: var(--red-light); transform: translateY(-1px); }
.search-btn:active { transform: translateY(0); }

/* 결과 */
.results-wrap {
  max-height: 340px;
  overflow-y: auto;
  background: var(--cream);
}
.results-wrap::-webkit-scrollbar { width: 5px; }
.results-wrap::-webkit-scrollbar-track { background: var(--red-pale); }
.results-wrap::-webkit-scrollbar-thumb { background: var(--red-mid); border-radius: 3px; }

.empty-state {
  text-align: center;
  padding: 16px 16px;
  color: var(--text-sub);
  font-size: 13px;
  line-height: 2;
}
.empty-tomato {
  font-size: 34px;
  display: block;
  margin-bottom: 8px;
  animation: bounce-gentle 2s ease-in-out infinite;
}
@keyframes bounce-gentle {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

.loading {
  text-align: center;
  padding: 36px;
  color: var(--text-sub);
  font-size: 13px;
}
.loading-row { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
.loading-tomato {
  font-size: 18px;
  animation: pop 0.8s infinite ease-in-out;
}
.loading-tomato:nth-child(2){animation-delay:0.2s}
.loading-tomato:nth-child(3){animation-delay:0.4s}
@keyframes pop{0%,80%,100%{transform:scale(0.7);opacity:0.4}40%{transform:scale(1.1);opacity:1}}

.results-header {
  padding: 10px 16px 6px;
  font-size: 11px;
  color: var(--red);
  font-weight: 700;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--red-pale);
  display: flex;
  align-items: center;
  gap: 4px;
}

.book-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 16px;
  cursor: default;
  border-bottom: 1px dashed rgba(232,57,42,0.1);
  transition: background 0.12s;
  position: relative;
}
.book-item:hover { background: #fff8f7; }
.book-item:last-child { border-bottom: none; }

.book-cover-wrap { position: relative; flex-shrink: 0; }
.book-cover {
  width: 38px;
  height: 54px;
  object-fit: cover;
  border-radius: 7px;
  display: block;
  background: transparent;
  box-shadow: 2px 3px 8px rgba(232,57,42,0.2);
  border: 1.5px solid var(--red-mid);
}
.cover-placeholder {
  width: 38px; height: 54px;
  border-radius: 7px;
  background: linear-gradient(135deg, var(--red-pale), var(--red-mid));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  border: 1.5px solid var(--red-mid);
}

.book-info { flex: 1; min-width: 0; }
.book-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.45;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.book-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.book-author {
  font-size: 11px;
  color: var(--text-sub);
}
.book-dot { color: var(--red-mid); font-size: 10px; }
.book-publisher {
  font-size: 11px;
  color: #c4a09a;
}

.add-btn {
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 34px; height: 34px;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
  line-height: 1;
}
.add-btn:hover {
  background: var(--red-light);
  transform: scale(1.1) rotate(5deg);
  box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
}
.add-btn:active { transform: scale(0.95); }
.add-btn.saving {
  background: #ffb8b0;
  cursor: not-allowed;
  animation: spin 0.8s linear infinite;
  font-size: 14px;
}
@keyframes spin { to{transform:rotate(360deg)} }
.add-btn.done {
  background: var(--green);
  animation: none;
  transform: scale(1);
  font-size: 16px;
}

/* 하단 */
.widget-footer {
  background: transparent;
  border-top: 1.5px dashed var(--red-mid);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-sub);
}

/* 토스트 */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: #fff;
  padding: 10px 22px;
  border-radius: 24px;
  font-size: 13px;
  font-family: inherit;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 9999;
  white-space: nowrap;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.home-btn {
  background: none;
  border: none;
  color: var(--red);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
  flex-shrink: 0;
  font-weight: 700;
  line-height: 1;
  opacity: 0.7;
  transition: opacity 0.15s;
}
.home-btn:hover { opacity: 1; }
.toast.success { background: #c0392b; }
.toast.error { background: #7f8c8d; }
</style>
</head>
<body>

<div class="widget">

  <!-- 헤더+물결 SVG 통합 -->
  <div style="position:relative;line-height:0">
    <svg width="100%" height="70" viewBox="0 0 300 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridCheck" patternUnits="userSpaceOnUse" width="14" height="14">
          <rect width="14" height="14" fill="#e8392a"/>
          <line x1="0" y1="0" x2="14" y2="0" stroke="rgba(255,180,170,0.5)" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="0" y2="14" stroke="rgba(255,180,170,0.5)" stroke-width="1.5"/>
          <line x1="0" y1="14" x2="14" y2="14" stroke="rgba(255,180,170,0.5)" stroke-width="1.5"/>
          <line x1="14" y1="0" x2="14" y2="14" stroke="rgba(255,180,170,0.5)" stroke-width="1.5"/>
        </pattern>
      </defs>
      <!-- 패턴 전체 채우기 -->
      <rect width="300" height="70" fill="url(#gridCheck)"/>
      <!-- 크림색 물결로 아래만 덮기 -->
      <path d="M0,52 Q7.5,44 15,52 Q22.5,60 30,52 Q37.5,44 45,52 Q52.5,60 60,52 Q67.5,44 75,52 Q82.5,60 90,52 Q97.5,44 105,52 Q112.5,60 120,52 Q127.5,44 135,52 Q142.5,60 150,52 Q157.5,44 165,52 Q172.5,60 180,52 Q187.5,44 195,52 Q202.5,60 210,52 Q217.5,44 225,52 Q232.5,60 240,52 Q247.5,44 255,52 Q262.5,60 270,52 Q277.5,44 285,52 Q292.5,60 300,52 L300,70 L0,70 Z" fill="#fffaf9"/>
    </svg>
    <!-- 텍스트 오버레이 -->
    <div style="position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:center">
      <div style="font-size:15px;font-weight:900;color:#fff;text-shadow:-1px -1px 0 rgba(200,50,30,0.4), 1px -1px 0 rgba(200,50,30,0.4), -1px 1px 0 rgba(200,50,30,0.4), 1px 1px 0 rgba(200,50,30,0.4), 0 2px 4px rgba(0,0,0,0.2);font-family:inherit;letter-spacing:1px;-webkit-text-stroke:0.5px rgba(255,255,255,0.3)">Tomato Book Search</div>
    </div>
  </div>

  <div class="check-divider" style="display:none"></div>

  <div class="search-wrap">
    <div class="search-box">
      <button class="home-btn" onclick="goHome()" title="처음으로">←</button>
      <input class="search-input" id="searchInput" type="text" placeholder="책 제목, 저자 입력..." maxlength="100">
      <button class="search-btn" onclick="searchBooks()">검색</button>
    </div>
  </div>

  <div class="results-wrap" id="resultsWrap">
    <div class="empty-state">
      <span class="empty-tomato">🍅</span>
      <div style="font-size:12px;color:var(--text-sub);margin-top:8px">+ 버튼을 누르면 DB에 자동으로 추가돼요</div>
    </div>
  </div>

  <div class="widget-footer">
    🍅 &nbsp;오늘도 좋은 하루 &nbsp;🍅
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KAKAO_KEY = 'c6374688b8e40718c91a8b3fcbe933c9';
const NOTION_TOKEN = 'ntn_i32163069517ambmcoQSZP8YjoGDD3aIt7uS8iZefaIdJD';
const DB_ID = '3600bfb4f307809f95a6c3a7ce6d02cb';

let searchResults = [];

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchBooks();
});

async function searchBooks() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return;

  const wrap = document.getElementById('resultsWrap');
  wrap.innerHTML = `<div class="loading">🍅 검색 중이에요...<div class="loading-row"><span class="loading-tomato">🍅</span><span class="loading-tomato">🍅</span><span class="loading-tomato">🍅</span></div></div>`;

  try {
    const res = await fetch(`https://dapi.kakao.com/v3/search/book?query=${encodeURIComponent(query)}&size=15`, {
      headers: { 'Authorization': `KakaoAK ${KAKAO_KEY}` }
    });
    const data = await res.json();
    searchResults = data.documents || [];
    renderResults();
  } catch(e) {
    wrap.innerHTML = `<div class="empty-state"><span class="empty-tomato">😢</span>검색 중 오류가 났어요<br><span style="font-size:12px;color:#d4a09a">잠시 후 다시 시도해주세요</span></div>`;
  }
}

function renderResults() {
  const wrap = document.getElementById('resultsWrap');
  if (!searchResults.length) {
    wrap.innerHTML = `<div class="empty-state"><span class="empty-tomato">🔍</span>검색 결과가 없어요<br><span style="font-size:12px;color:#d4a09a">다른 검색어로 시도해보세요</span></div>`;
    return;
  }

  const header = `<div class="results-header">🍅 검색 결과 ${searchResults.length}권</div>`;
  const items = searchResults.map((book, i) => {
    const title = book.title || '제목 없음';
    const authors = (book.authors || []).join(', ');
    const publisher = book.publisher || '';
    const thumbnail = book.thumbnail || '';

    return `<div class="book-item">
      <div class="book-cover-wrap">
        ${thumbnail
          ? `<img class="book-cover" src="${thumbnail}" alt="${title}" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="cover-placeholder" style="display:none">📖</div>`
          : `<div class="cover-placeholder">📖</div>`
        }
      </div>
      <div class="book-info">
        <div class="book-title">${title}</div>
        <div class="book-meta">
          <span class="book-author">${authors}</span>
          ${publisher ? `<span class="book-dot">·</span><span class="book-publisher">${publisher}</span>` : ''}
        </div>
      </div>
      <button class="add-btn" id="btn-${i}" onclick="addToNotion(${i})" title="독서 노트에 추가">+</button>
    </div>`;
  }).join('');

  wrap.innerHTML = header + items;
}

async function addToNotion(idx) {
  const book = searchResults[idx];
  const btn = document.getElementById(`btn-${idx}`);
  if (!btn || btn.classList.contains('done')) return;

  btn.classList.add('saving');
  btn.textContent = '🍅';

  try {
    const title = book.title || '';
    const authors = (book.authors || []).join(', ');
    const publisher = book.publisher || '';
    const thumbnail = book.thumbnail || '';
    const isbn = (book.isbn || '').split(' ').pop();

    const res = await fetch('https://hook.eu1.make.com/9x2m54k78qo1sdoanwqlisswawk83cxd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title, authors, publisher, isbn, thumbnail
      })
    });

    if (!res.ok) throw new Error();

    btn.classList.remove('saving');
    btn.classList.add('done');
    btn.textContent = '✓';
    showToast(`🍅 "${title}" 저장 완료!`, 'success');

  } catch(e) {
    btn.classList.remove('saving');
    btn.textContent = '+';
    showToast('😢 저장 중 오류가 났어요', 'success');
  }
}

function goHome() {
  document.getElementById('searchInput').value = '';
  document.getElementById('resultsWrap').innerHTML = `<div class="empty-state">
    <span class="empty-tomato">🍅</span>
    <div style="font-size:12px;color:var(--text-sub);margin-top:8px">+ 버튼을 누르면 DB에 자동으로 추가돼요</div>
  </div>`;
  searchResults = [];
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.className = `toast ${type}`, 3000);
}
</script>
</body>
</html>
