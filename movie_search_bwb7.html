<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍿 영화 검색</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet">
<style>@import url("https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css");</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;
  --bg2: #f5f5f5;
  --bg3: #eeeeee;
  --red: #111111;
  --red-light: #333333;
  --gold: #111111;
  --white: #111111;
  --text-sub: #888888;
  --green: #4a7c3f;
}
body {
  font-family: "NanumSquareRound","Nanum Gothic",-apple-system,sans-serif;
  background: transparent;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 16px 12px;
}
.widget {
  width: 100%;
  max-width: 300px;
  background: var(--bg);
  border-radius: 20px;
  overflow: hidden;
  outline: 2px solid rgba(0,0,0,0.15);
  position: relative;
}
.search-wrap {
  padding: 1px 16px 10px;
  background: var(--bg);
  border-bottom: 1.5px solid rgba(255,255,255,0.15);
}
.search-box {
  display: flex;
  align-items: center;
  background: #111111;
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 0 8px 0 14px;
  gap: 8px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.search-box:focus-within {
  border-color: #ffffff;
  box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
}
.search-input {
  flex: 1;
  padding: 11px 0;
  border: none;
  background: none;
  font-size: 13px;
  font-family: inherit;
  color: #ffffff;
  outline: none;
}
.search-input::placeholder { color: rgba(255,255,255,0.9); }
.search-btn {
  background: #e50914;
  color: #ffffff;
  border: none;
  border-radius: 10px;
  padding: 7px 14px;
  font-size: 12px;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.3px;
}
.search-btn:hover { background: #ff2020; transform: translateY(-1px); }
.search-btn:active { transform: translateY(0); }
.results-wrap {
  max-height: 340px;
  overflow-y: auto;
  background: #ffffff;
}
.results-wrap::-webkit-scrollbar { width: 5px; }
.results-wrap::-webkit-scrollbar-track { background: #f5f5f5; }
.results-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
.empty-state {
  text-align: center;
  padding: 20px 16px;
  font-size: 13px;
  line-height: 2;
}
.empty-icon { font-size: 36px; display: block; margin-bottom: 8px; animation: bounce-gentle 2s ease-in-out infinite; }
@keyframes bounce-gentle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.loading { text-align: center; padding: 36px; color: var(--text-sub); font-size: 13px; }
.loading-row { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
.loading-popcorn { font-size: 18px; animation: pop 0.8s infinite ease-in-out; }
.loading-popcorn:nth-child(2){animation-delay:0.2s}
.loading-popcorn:nth-child(3){animation-delay:0.4s}
@keyframes pop{0%,80%,100%{transform:scale(0.7);opacity:0.4}40%{transform:scale(1.1);opacity:1}}
.results-header {
  padding: 10px 16px 6px;
  font-size: 11px;
  color: rgba(255,255,255,0.9);
  font-weight: 700;
  letter-spacing: 0.5px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 4px;
}
.movie-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 16px;
  border-bottom: 1px dashed rgba(0,0,0,0.08);
  transition: background 0.12s;
}
.movie-item:hover { background: #f5f5f5; }
.movie-item:last-child { border-bottom: none; }
.movie-poster {
  width: 38px; height: 54px;
  object-fit: cover;
  border-radius: 7px;
  display: block;
  box-shadow: 2px 3px 10px rgba(0,0,0,0.6);
  border: 1.5px solid rgba(255,255,255,0.12);
  flex-shrink: 0;
}
.poster-placeholder {
  width: 38px; height: 54px;
  border-radius: 7px;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  border: 1.5px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.movie-info { flex: 1; min-width: 0; }
.movie-title {
  font-size: 13px;
  font-weight: 700;
  color: #111111;
  line-height: 1.45;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.movie-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.movie-year { font-size: 11px; color: var(--text-sub); }
.movie-dot  { color: rgba(255,255,255,0.2); font-size: 10px; }
.movie-type { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 700; }
.type-movie { background: rgba(0,0,0,0.08); color: #111111; }
.type-tv    { background: rgba(0,0,0,0.05); color: #555555; }
.add-btn {
  background: var(--bg3);
  color: var(--white);
  border: 1.5px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  width: 34px; height: 34px;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  line-height: 1;
}
.add-btn:hover { background: var(--red); color: #fff; border-color: var(--red); transform: scale(1.1) rotate(5deg); }
.add-btn.saving { opacity: 0.4; cursor: not-allowed; animation: spin 0.8s linear infinite; font-size: 14px; }
@keyframes spin { to{transform:rotate(360deg)} }
.add-btn.done { background: #1a3a1a; color: #4caf50; border-color: #4caf50; animation: none; transform: scale(1); font-size: 16px; }
.home-btn {
  background: none; border: none;
  color: #ffffff;
  font-size: 16px; cursor: pointer;
  padding: 0 4px; flex-shrink: 0;
  font-weight: 700; line-height: 1;
  transition: color 0.15s;
}
.home-btn:hover { color: rgba(255,255,255,0.7); }
.widget-footer {
  background: #111111;
  border-top: 1.5px solid rgba(255,255,255,0.1);
  padding: 8px 16px;
  display: flex; align-items: center; justify-content: center;
  gap: 6px; font-size: 11px; color: #ffffff;
}
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg3); color: var(--white);
  padding: 10px 22px; border-radius: 24px;
  font-size: 13px; font-family: inherit;
  border: 1px solid rgba(255,255,255,0.15);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 9999; white-space: nowrap; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--red); color: var(--gold); }
</style>
</head>
<body>
<div class="widget">
                  <div style="position:relative;line-height:0">
    <svg width="100%" height="70" viewBox="0 0 300 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="checkGrid" patternUnits="userSpaceOnUse" width="14" height="14">
          <rect width="14" height="14" fill="#111111"/>
          <line x1="0" y1="0" x2="14" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="0" y2="14" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
          <line x1="0" y1="14" x2="14" y2="14" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
          <line x1="14" y1="0" x2="14" y2="14" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
        </pattern>
      </defs>
      <rect width="300" height="70" fill="url(#checkGrid)"/>
      <path d="M0,52 Q7.5,44 15,52 Q22.5,60 30,52 Q37.5,44 45,52 Q52.5,60 60,52 Q67.5,44 75,52 Q82.5,60 90,52 Q97.5,44 105,52 Q112.5,60 120,52 Q127.5,44 135,52 Q142.5,60 150,52 Q157.5,44 165,52 Q172.5,60 180,52 Q187.5,44 195,52 Q202.5,60 210,52 Q217.5,44 225,52 Q232.5,60 240,52 Q247.5,44 255,52 Q262.5,60 270,52 Q277.5,44 285,52 Q292.5,60 300,52 L300,70 L0,70 Z" fill="#ffffff"/>
    </svg>
    <div style="position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:center">
      <div style="font-size:15px;font-weight:900;color:#ffffff;font-family:inherit;letter-spacing:1px;">Cinema Search</div>
    </div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <button class="home-btn" onclick="goHome()">←</button>
      <input class="search-input" id="searchInput" type="text" placeholder="영화 또는 드라마 입력..." maxlength="100">
      <button class="search-btn" onclick="searchMovies()">검색</button>
    </div>
  </div>
  <div class="results-wrap" id="resultsWrap">
    <div class="empty-state">
      <span class="empty-icon">🍿</span>
      <div style="font-size:12px;color:#111111;margin-top:4px">+ 버튼을 누르면 DB에 자동으로 추가돼요</div>
    </div>
  </div>
  <div class="widget-footer">🍿 &nbsp;오늘도 좋은 하루 &nbsp;🍿</div>
</div>
<div class="toast" id="toast"></div>
<script>
const TMDB_KEY = "a61682d8e5876db46cd4ceab29ba8756";
const MAKE_WEBHOOK = "https://hook.eu1.make.com/1w01mng1z8vpmwvesyqxpx37sfgjgt4s";
let searchResults = [];

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") searchMovies();
});

async function searchMovies() {
  const query = document.getElementById("searchInput").value.trim();
  if (!query) return;
  const wrap = document.getElementById("resultsWrap");
  wrap.innerHTML = "<div class=\"loading\">🍿 검색 중이에요...<div class=\"loading-row\"><span class=\"loading-popcorn\">🍿</span><span class=\"loading-popcorn\">🍿</span><span class=\"loading-popcorn\">🍿</span></div></div>";
  try {
    const [mr, tr] = await Promise.all([
      fetch("https://api.themoviedb.org/3/search/movie?api_key=" + TMDB_KEY + "&language=ko-KR&query=" + encodeURIComponent(query) + "&page=1"),
      fetch("https://api.themoviedb.org/3/search/tv?api_key=" + TMDB_KEY + "&language=ko-KR&query=" + encodeURIComponent(query) + "&page=1")
    ]);
    const md = await mr.json(), td = await tr.json();
    searchResults = [
      ...(md.results || []).map(m => ({ ...m, media_type: "movie" })),
      ...(td.results || []).map(t => ({ ...t, media_type: "tv" }))
    ].sort((a, b) => b.popularity - a.popularity).slice(0, 15);
    renderResults();
  } catch(e) {
    wrap.innerHTML = "<div class=\"empty-state\"><span class=\"empty-icon\">😢</span><div style=\"font-size:12px;color:#111111\">검색 중 오류가 났어요</div></div>";
  }
}

function renderResults() {
  const wrap = document.getElementById("resultsWrap");
  if (!searchResults.length) {
    wrap.innerHTML = "<div class=\"empty-state\"><span class=\"empty-icon\">🔍</span><div style=\"font-size:12px;color:#111111\">검색 결과가 없어요</div></div>";
    return;
  }
  let html = "<div class=\"results-header\">🍿 검색 결과 " + searchResults.length + "건</div>";
  searchResults.forEach((item, i) => {
    const isMovie = item.media_type === "movie";
    const title = isMovie ? (item.title || "제목 없음") : (item.name || "제목 없음");
    const date = isMovie ? item.release_date : item.first_air_date;
    const year = date ? date.substring(0, 4) : "";
    const poster = item.poster_path ? "https://image.tmdb.org/t/p/w92" + item.poster_path : "";
    const typeLabel = isMovie ? "영화" : "드라마";
    const typeClass = isMovie ? "type-movie" : "type-tv";
    html += "<div class=\"movie-item\">";
    html += "<div style=\"flex-shrink:0\">";
    if (poster) {
      html += "<img class=\"movie-poster\" src=\"" + poster + "\" alt=\"" + title + "\" onerror=\"this.style.display='none';this.nextSibling.style.display='flex'\">";
      html += "<div class=\"poster-placeholder\" style=\"display:none\">🍿</div>";
    } else {
      html += "<div class=\"poster-placeholder\">🍿</div>";
    }
    html += "</div>";
    html += "<div class=\"movie-info\">";
    html += "<div class=\"movie-title\">" + title + "</div>";
    html += "<div class=\"movie-meta\">";
    if (year) html += "<span class=\"movie-year\">" + year + "</span><span class=\"movie-dot\">·</span>";
    html += "<span class=\"movie-type " + typeClass + "\">" + typeLabel + "</span>";
    html += "</div></div>";
    html += "<button class=\"add-btn\" id=\"btn-" + i + "\" onclick=\"addToNotion(" + i + ")\">+</button>";
    html += "</div>";
  });
  wrap.innerHTML = html;
}

async function addToNotion(idx) {
  const item = searchResults[idx];
  const btn = document.getElementById("btn-" + idx);
  if (!btn || btn.classList.contains("done")) return;
  btn.classList.add("saving");
  btn.textContent = "⟳";
  const isMovie = item.media_type === "movie";
  const title = isMovie ? (item.title || "") : (item.name || "");
  const date = isMovie ? item.release_date : item.first_air_date;
  const poster = item.poster_path ? "https://image.tmdb.org/t/p/w500" + item.poster_path : "";
  const type = isMovie ? "영화" : "드라마";
  try {
    const res = await fetch(MAKE_WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, date, poster, type })
    });
    if (!res.ok) throw new Error();
    btn.classList.remove("saving");
    btn.classList.add("done");
    btn.textContent = "✓";
    showToast("🍿 \"" + title + "\" 저장 완료!", "success");
  } catch(e) {
    btn.classList.remove("saving");
    btn.textContent = "+";
    showToast("😢 저장 중 오류가 났어요");
  }
}

function goHome() {
  document.getElementById("searchInput").value = "";
  document.getElementById("resultsWrap").innerHTML = "<div class=\"empty-state\"><span class=\"empty-icon\">🍿</span><div style=\"font-size:12px;color:#111111;margin-top:4px\">+ 버튼을 누르면 DB에 자동으로 추가돼요</div></div>";
  searchResults = [];
}

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (type || "") + " show";
  setTimeout(() => t.className = "toast " + (type || ""), 3000);
}
</script>
</body>
</html>
