<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomato Book Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" rel="stylesheet">
<style>
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.eot');
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.eot?#iefix') format('embedded-opentype'),
       url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.woff') format('woff'),
       url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.ttf') format('truetype');
  font-weight: 700;
}
@font-face {
  font-family: 'NanumSquareRound';
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.eot');
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.eot?#iefix') format('embedded-opentype'),
       url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.woff') format('woff'),
       url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.ttf') format('truetype');
  font-weight: 900;
}
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
 
:root {
  --red: #e8392a;
  --red-light: #ff6b5b;
  --red-pale: #fff0ee;
  --red-mid: #ffd5d0;
  --green: #4a7c3f;
  --cream: #fffaf9;
  --text: #3a1a16;
  --text-sub: #9b6b65;
}
 
body {
  font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif;
  background: transparent;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 16px 12px;
}
 
.widget {
  width: 100%;
  max-width: 340px;
  background: var(--cream);
  border-radius: 20px;
  overflow: hidden;
  outline: 2px solid rgba(232,57,42,0.2);
}
 
/* 헤더 */
.widget-header {
  position: relative;
  line-height: 0;
}
.widget-header svg { display: block; }
.header-content {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 62px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0 16px;
}
.header-title {
  font-size: 15px;
  font-weight: 900;
  color: #fff;
  font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif;
  text-shadow: -1px -1px 0 rgba(200,50,30,0.4), 1px -1px 0 rgba(200,50,30,0.4), -1px 1px 0 rgba(200,50,30,0.4), 1px 1px 0 rgba(200,50,30,0.4), 0 2px 4px rgba(0,0,0,0.2);
  letter-spacing: 1px;
  text-align: center;
  line-height: 1;
  -webkit-text-stroke: 0.5px rgba(255,255,255,0.3);
}
.header-nav-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.nav-btn {
  background: rgba(255,255,255,0.25);
  border: none;
  color: #fff;
  width: 18px; height: 18px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 11px;
  font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
  font-family: inherit;
  line-height: 1;
  padding: 0;
}
.nav-btn:hover { background: rgba(255,255,255,0.5); }
.month-label {
  font-size: 13px;
  font-weight: 900;
  color: #fff;
  font-family: 'NanumSquareRound', 'Nanum Gothic', sans-serif;
  text-shadow: -1px -1px 0 rgba(200,50,30,0.3), 1px 1px 0 rgba(200,50,30,0.3), 0 2px 4px rgba(0,0,0,0.2);
  min-width: 52px;
  text-align: center;
  letter-spacing: 0.5px;
}
 
/* 요일 헤더 */
.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 8px 0 4px;
  margin: 0 12px;
}
.weekday {
  text-align: center;
  font-size: 11px;
  font-weight: 900;
  color: var(--text-sub);
  letter-spacing: 0.5px;
  padding-bottom: 4px;
}
.weekday:first-child { color: var(--red); }
.weekday:last-child { color: #6b9bd1; }
 
/* 달력 그리드 */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
  border-left: 1px solid rgba(232,57,42,0.15);
  border-top: 1px solid rgba(232,57,42,0.15);
  margin: 0 12px 10px;
}
.day-cell {
  position: relative;
  aspect-ratio: 1 / 1.3;
  border-right: 1px solid rgba(232,57,42,0.15);
  border-bottom: 1px solid rgba(232,57,42,0.15);
  overflow: hidden;
}
.day-cell.has-book {
  cursor: pointer;
}
.day-cell.has-book:hover {
  background: rgba(232,57,42,0.06);
}
.day-num {
  font-size: 9px;
  font-weight: 900;
  color: var(--text-sub);
  line-height: 1;
  position: absolute;
  top: 3px;
  left: 0;
  right: 0;
  text-align: center;
  z-index: 2;
}
.day-cell.has-book .day-num {
  display: none;
}
.day-cell.today:not(.has-book) .day-num {
  display: block !important;
  color: #fff;
  background: var(--red);
  border-radius: 50%;
  width: 16px; height: 16px;
  line-height: 16px;
  text-align: center;
  position: absolute;
  top: 2px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
}
.day-cell.today.has-book .day-num {
  display: none !important;
}
.day-cell.sunday .day-num { color: var(--red); }
.day-cell.saturday .day-num { color: #6b9bd1; }
.day-cell.other-month .day-num { color: rgba(58,26,22,0.25); }
 
.covers-wrap {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
  gap: 0;
  z-index: 1;
}
.covers-wrap:has(.cover-thumb:nth-child(2)) {
  grid-template-columns: 1fr 1fr;
}
.covers-wrap:has(.cover-thumb:nth-child(3)) {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.covers-wrap:has(.cover-thumb:nth-child(4)) {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.cover-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  min-height: 0;
}
.cover-placeholder-sm {
  width: 32px; height: 40px;
  border-radius: 3px;
  background: linear-gradient(135deg, var(--red-pale), var(--red-mid));
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  border: 1px solid var(--red-mid);
}
 
/* 로딩 */
.loading-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-sub);
  font-size: 13px;
}
.loading-row { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
.loading-tomato { font-size: 18px; animation: pop 0.8s infinite ease-in-out; }
.loading-tomato:nth-child(2){animation-delay:0.2s}
.loading-tomato:nth-child(3){animation-delay:0.4s}
@keyframes pop{0%,80%,100%{transform:scale(0.7);opacity:0.4}40%{transform:scale(1.1);opacity:1}}
 
/* 푸터 */
.widget-footer-unused {
  display: none;
  gap: 6px;
  font-size: 11px;
  color: var(--text-sub);
}
 
/* 팝업 */
.popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(58,26,22,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.popup-overlay.show {
  opacity: 1;
  pointer-events: all;
}
.popup {
  background: var(--cream);
  border-radius: 20px;
  outline: 2px solid rgba(232,57,42,0.2);
  max-width: 280px;
  width: 100%;
  overflow: hidden;
  transform: scale(0.9) translateY(10px);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.popup-overlay.show .popup {
  transform: scale(1) translateY(0);
}
.popup-header {
  background: var(--red);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.popup-date {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
}
.popup-close {
  background: rgba(255,255,255,0.3);
  border: none;
  color: #fff;
  width: 24px; height: 24px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
}
.popup-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 60vh;
  overflow-y: auto;
}
.popup-book {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding-bottom: 12px;
  border-bottom: 1px dashed rgba(232,57,42,0.15);
}
.popup-book:last-child { border-bottom: none; padding-bottom: 0; }
.popup-cover {
  width: 52px;
  height: 72px;
  object-fit: cover;
  border-radius: 6px;
  flex-shrink: 0;
  box-shadow: 2px 3px 8px rgba(232,57,42,0.2);
  border: 1.5px solid var(--red-mid);
}
.popup-cover-placeholder {
  width: 52px; height: 72px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--red-pale), var(--red-mid));
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  border: 1.5px solid var(--red-mid);
}
.popup-info { flex: 1; min-width: 0; }
.popup-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 4px;
}
.popup-meta {
  font-size: 11px;
  color: var(--text-sub);
  line-height: 1.6;
}
.popup-tag {
  display: inline-block;
  background: var(--red-pale);
  color: var(--red);
  border-radius: 6px;
  padding: 2px 7px;
  font-size: 10px;
  font-weight: 700;
  margin-top: 4px;
}
.popup-tag.finish { background: var(--red-pale); color: var(--red); }
.popup-tag.reading { background: var(--red-pale); color: var(--red); }
</style>
</head>
<body>
 
<div class="widget">
  <div class="widget-header">
    <svg width="100%" height="80" viewBox="0 0 340 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridCheck" patternUnits="userSpaceOnUse" width="14" height="14">
          <rect width="14" height="14" fill="#e8392a"/>
          <line x1="0" y1="0" x2="14" y2="0" stroke="rgba(255,180,170,0.5)" stroke-width="1.5"/>
          <line x1="0" y1="0" x2="0" y2="14" stroke="rgba(255,180,170,0.5)" stroke-width="1.5"/>
          <line x1="0" y1="14" x2="14" y2="14" stroke="rgba(255,180,170,0.5)" stroke-width="1.5"/>
          <line x1="14" y1="0" x2="14" y2="14" stroke="rgba(255,180,170,0.5)" stroke-width="1.5"/>
        </pattern>
      </defs>
      <rect width="340" height="70" fill="url(#gridCheck)"/>
      <path d="M0,62 Q8.5,54 17,62 Q25.5,70 34,62 Q42.5,54 51,62 Q59.5,70 68,62 Q76.5,54 85,62 Q93.5,70 102,62 Q110.5,54 119,62 Q127.5,70 136,62 Q144.5,54 153,62 Q161.5,70 170,62 Q178.5,54 187,62 Q195.5,70 204,62 Q212.5,54 221,62 Q229.5,70 238,62 Q246.5,54 255,62 Q263.5,70 272,62 Q280.5,54 289,62 Q297.5,70 306,62 Q314.5,54 323,62 Q331.5,70 340,62 L340,80 L0,80 Z" fill="#fffaf9"/>
    </svg>
    <div class="header-content">
      <div class="header-title">Tomato Book Calendar</div>
      <div class="header-nav-row">
        <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
      </div>
    </div>
  </div>
 
  <div class="weekdays">
    <div class="weekday">일</div>
    <div class="weekday">월</div>
    <div class="weekday">화</div>
    <div class="weekday">수</div>
    <div class="weekday">목</div>
    <div class="weekday">금</div>
    <div class="weekday">토</div>
  </div>
 
  <div class="calendar-grid" id="calendarGrid">
    <div class="loading-state" style="grid-column:1/-1">
      🍅 불러오는 중...
      <div class="loading-row">
        <span class="loading-tomato">🍅</span>
        <span class="loading-tomato">🍅</span>
        <span class="loading-tomato">🍅</span>
      </div>
    </div>
  </div>
 
</div>
 
<!-- 팝업 -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup(event)">
  <div class="popup" id="popup">
    <div class="popup-header">
      <span class="popup-date" id="popupDate"></span>
      <button class="popup-close" onclick="closePopupDirect()">✕</button>
    </div>
    <div class="popup-body" id="popupBody"></div>
  </div>
</div>
 
<script>
const NOTION_TOKEN = 'ntn_l32163069516Up1A2Rf37txdXOzscWrGbvrhjTZ8394bbO';
const DB_ID = 'd000bfb4f30783339a7081544b25ebae';
 
let currentYear, currentMonth;
let allBooks = [];
 
const today = new Date();
currentYear = today.getFullYear();
currentMonth = today.getMonth();
 
async function fetchBooks() {
  try {
    const res = await fetch('https://hook.eu1.make.com/6o4lko885edvkzgznku2d5uki3ntcq5v', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    const data = await res.json();
    allBooks = (data.results || []).map(page => {
      const props = page.properties;
      const title = props['이름']?.title?.[0]?.plain_text || props['제목']?.title?.[0]?.plain_text || props['title']?.title?.[0]?.plain_text || '제목 없음';
      const author = props['저자']?.rich_text?.[0]?.plain_text || props['author']?.rich_text?.[0]?.plain_text || '';
      const publisher = props['출판사']?.rich_text?.[0]?.plain_text || '';
      const status = props['읽기 상태']?.select?.name || props['상태']?.select?.name || '';
      const finishDateStart = props['완독한 날짜']?.date?.start || null;
      const finishDateEnd = props['완독한 날짜']?.date?.end || finishDateStart;
      const startDate = props['읽기 시작한 날짜']?.date?.start || props['읽기 시작']?.date?.start || null;
      // 날짜 범위 내 모든 날짜 생성
      const finishDates = finishDateStart ? getDateRange(finishDateStart, finishDateEnd) : [];
      const finishDate = finishDateStart;
      const coverFiles = props['표지']?.files || props['cover']?.files || [];
      let coverUrl = '';
      if (coverFiles.length > 0) {
        const f = coverFiles[0];
        coverUrl = f.type === 'external' ? f.external?.url : f.file?.url || '';
      }
      return { title, author, publisher, status, finishDate, finishDates, startDate, coverUrl };
    });
    renderCalendar();
  } catch(e) {
    document.getElementById('calendarGrid').innerHTML = `<div class="loading-state" style="grid-column:1/-1">😢 불러오기 실패<br><span style="font-size:11px">잠시 후 다시 시도해주세요</span></div>`;
  }
}
 
function getDateRange(start, end) {
  const dates = [];
  const cur = new Date(start);
  const endDate = new Date(end);
  while (cur <= endDate) {
    dates.push(cur.toISOString().split('T')[0]);
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}
 
function getBooksForDate(dateStr) {
  return allBooks.filter(b => 
    (b.finishDates && b.finishDates.includes(dateStr)) ||
    b.startDate === dateStr
  );
}
 
function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  const label = document.getElementById('monthLabel');
  label.textContent = `${currentYear}.${String(currentMonth+1).padStart(2,'0')}`;
 
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
 
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
 
  let html = '';
  let totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
 
  for (let i = 0; i < totalCells; i++) {
    let day, month, year, isOther = false;
    if (i < firstDay) {
      day = daysInPrev - firstDay + i + 1;
      month = currentMonth === 0 ? 11 : currentMonth - 1;
      year = currentMonth === 0 ? currentYear - 1 : currentYear;
      isOther = true;
    } else if (i >= firstDay + daysInMonth) {
      day = i - firstDay - daysInMonth + 1;
      month = currentMonth === 11 ? 0 : currentMonth + 1;
      year = currentMonth === 11 ? currentYear + 1 : currentYear;
      isOther = true;
    } else {
      day = i - firstDay + 1;
      month = currentMonth;
      year = currentYear;
    }
 
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const books = isOther ? [] : getBooksForDate(dateStr);
    const isToday = dateStr === todayStr;
    const dow = i % 7;
    const isSun = dow === 0;
    const isSat = dow === 6;
 
    let classes = 'day-cell';
    if (isOther) classes += ' other-month';
    if (isToday) classes += ' today';
    if (isSun && !isOther) classes += ' sunday';
    if (isSat && !isOther) classes += ' saturday';
    if (books.length > 0) classes += ' has-book';
 
    let coversHtml = '';
    if (books.length > 0) {
      coversHtml = `<div class="covers-wrap">`;
      books.slice(0, 4).forEach(b => {
        if (b.coverUrl) {
          coversHtml += `<img class="cover-thumb" src="${b.coverUrl}" alt="${b.title}" onerror="this.style.display='none'">`;
        } else {
          coversHtml += `<div class="cover-placeholder-sm">📖</div>`;
        }
      });
      coversHtml += `</div>`;
    }
 
    html += `<div class="${classes}" ${books.length > 0 ? `onclick="showPopup('${dateStr}')"` : ''}>
      <span class="day-num">${day}</span>
      ${coversHtml}
    </div>`;
  }
 
  grid.innerHTML = html;
}
 
function showPopup(dateStr) {
  const books = getBooksForDate(dateStr);
  if (!books.length) return;
 
  const [y, m, d] = dateStr.split('-');
  document.getElementById('popupDate').textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
 
  let html = '';
  books.forEach(b => {
    const isFinish = b.finishDate === dateStr;
    const tagLabel = isFinish ? '완독' : '시작';
    const tagClass = isFinish ? 'finish' : 'reading';
    html += `<div class="popup-book">
      ${b.coverUrl
        ? `<img class="popup-cover" src="${b.coverUrl}" alt="${b.title}">`
        : `<div class="popup-cover-placeholder">📖</div>`
      }
      <div class="popup-info">
        <div class="popup-title">${b.title}</div>
        <div class="popup-meta">
          ${b.author ? `✍️ ${b.author}<br>` : ''}
          ${b.publisher ? `📚 ${b.publisher}` : ''}
        </div>
        <span class="popup-tag ${tagClass}">${tagLabel}</span>
      </div>
    </div>`;
  });
 
  document.getElementById('popupBody').innerHTML = html;
  document.getElementById('popupOverlay').classList.add('show');
}
 
function closePopup(e) {
  if (e.target === document.getElementById('popupOverlay')) {
    document.getElementById('popupOverlay').classList.remove('show');
  }
}
 
function closePopupDirect() {
  document.getElementById('popupOverlay').classList.remove('show');
}
 
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
}
 
fetchBooks();
</script>
</body>
</html>
